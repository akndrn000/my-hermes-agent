<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">Lokasi konfigurasi</title>
  <desc id="d">Provider, model, timezone, dan pengaturan Discord di-hardcode di Dockerfile. API key, bot token, dan ID diisi di Railway Variables.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A14"/><stop offset="1" stop-color="#140F33"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <linearGradient id="ac2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient>
    <radialGradient id="gA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.28"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#A5F3FC"/><stop offset="0.45" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity="0.07"/></pattern>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,1 L12,7 L0,13 z" fill="#67E8F9"/></marker>
  </defs>
  <style>
    .sans{font-family:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif} .mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Consolas,'Courier New',monospace}
    .h1{font-family:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-weight:800;fill:#F8FAFC}
    .h2{font-family:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-weight:700;fill:#F1F5F9}
    .mu{font-family:ui-monospace,'SF Mono','JetBrains Mono',Consolas,'Courier New',monospace;fill:#94A3B8}
    .lb{font-family:ui-monospace,'SF Mono','JetBrains Mono',Consolas,'Courier New',monospace;font-weight:700;letter-spacing:1.5px}
    .flow{stroke-dasharray:6 6;animation:fl 1.2s linear infinite}
    @keyframes fl{to{stroke-dashoffset:-12}}
  </style>
