    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity="0.07"/></pattern>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,1 L12,7 L0,13 z" fill="#67E8F9"/></marker>
  </defs>
  <style>
    .sans{font-family:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif} .mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Consolas,'Courier New',monospace}
    .h1{font-family:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-weight:800;fill:#F8FAFC}
