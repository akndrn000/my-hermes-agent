    .lb{font-family:ui-monospace,'SF Mono','JetBrains Mono',Consolas,'Courier New',monospace;font-weight:700;letter-spacing:1.5px}
    .flow{stroke-dasharray:6 6;animation:fl 1.2s linear infinite}
    @keyframes fl{to{stroke-dashoffset:-12}}
