<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-labelledby="t d">
  <title id="t">Setup in 5 steps</title>
  <desc id="d">Create a Telegram bot, a Discord bot, an Atria API key, push the repo to GitHub, then deploy on Railway with a volume at /opt/data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A14"/><stop offset="1" stop-color="#140F33"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <linearGradient id="ac2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient>
    <radialGradient id="gA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.28"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#A5F3FC"/><stop offset="0.45" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity="0.07"/></pattern>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,1 L12,7 L0,13 z" fill="#67E8F9"/></marker>
  </defs>
  <style>
    .sans{font-family:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif} .mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Consolas,'Courier New',monospace}
    .h1{font-family:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-weight:800;fill:#F8FAFC}
    .h2{font-family:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-weight:700;fill:#F1F5F9}
    .mu{font-family:ui-monospace,'SF Mono','JetBrains Mono',Consolas,'Courier New',monospace;fill:#94A3B8}
    .lb{font-family:ui-monospace,'SF Mono','JetBrains Mono',Consolas,'Courier New',monospace;font-weight:700;letter-spacing:1.5px}
    .flow{stroke-dasharray:6 6;animation:fl 1.2s linear infinite}
    @keyframes fl{to{stroke-dashoffset:-12}}
  </style>
  <rect width="1200" height="410" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="410" rx="22" fill="url(#grid)"/>
  <circle cx="144" cy="0" r="300" fill="url(#gA)"/>
  <circle cx="1104" cy="410" r="320" fill="url(#gB)"/>
  <text x="40" y="52" class="h1" font-size="26">Setup in 5 steps</text>
  <rect x="40" y="64" width="64" height="3" rx="1.5" fill="url(#ac)"/>
  <text x="120" y="69" class="mu" font-size="13">from zero to a running agent</text>
  <line x1="76" y1="150" x2="1124" y2="150" stroke="url(#ac)" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="3 7"/>
  <rect x="40" y="112" width="212" height="208" rx="16" fill="none" stroke="#38BDF8" stroke-opacity="0.14" stroke-width="7"/>
  <rect x="40" y="112" width="212" height="208" rx="16" fill="#0F172A" fill-opacity="0.92" stroke="#38BDF8" stroke-opacity="0.65" stroke-width="1.5"/>
  <circle cx="84" cy="150" r="30" fill="#38BDF8" fill-opacity="0.14"/>
  <circle cx="84" cy="150" r="22" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  <text x="84" y="157" text-anchor="middle" class="mono" font-weight="800" font-size="18" fill="#38BDF8">1</text>
  <text x="60" y="216" class="h2" font-size="19">Telegram bot</text>
  <rect x="60" y="228" width="40" height="2" rx="1" fill="#38BDF8"/>
  <text x="60" y="256" class="mu" font-size="13">BotFather /newbot</text>
  <text x="60" y="278" class="mu" font-size="13">save token + ID</text>
  <rect x="267" y="112" width="212" height="208" rx="16" fill="none" stroke="#818CF8" stroke-opacity="0.14" stroke-width="7"/>
  <rect x="267" y="112" width="212" height="208" rx="16" fill="#0F172A" fill-opacity="0.92" stroke="#818CF8" stroke-opacity="0.65" stroke-width="1.5"/>
  <circle cx="311" cy="150" r="30" fill="#818CF8" fill-opacity="0.14"/>
  <circle cx="311" cy="150" r="22" fill="#0F172A" stroke="#818CF8" stroke-width="2"/>
  <text x="311" y="157" text-anchor="middle" class="mono" font-weight="800" font-size="18" fill="#818CF8">2</text>
  <text x="287" y="216" class="h2" font-size="19">Discord bot</text>
  <rect x="287" y="228" width="40" height="2" rx="1" fill="#818CF8"/>
  <text x="287" y="256" class="mu" font-size="13">Developer Portal</text>
  <text x="287" y="278" class="mu" font-size="13">intents + invite</text>
  <rect x="494" y="112" width="212" height="208" rx="16" fill="none" stroke="#F472B6" stroke-opacity="0.14" stroke-width="7"/>
  <rect x="494" y="112" width="212" height="208" rx="16" fill="#0F172A" fill-opacity="0.92" stroke="#F472B6" stroke-opacity="0.65" stroke-width="1.5"/>
  <circle cx="538" cy="150" r="30" fill="#F472B6" fill-opacity="0.14"/>
  <circle cx="538" cy="150" r="22" fill="#0F172A" stroke="#F472B6" stroke-width="2"/>
  <text x="538" y="157" text-anchor="middle" class="mono" font-weight="800" font-size="18" fill="#F472B6">3</text>
  <text x="514" y="216" class="h2" font-size="19">Atria API key</text>
  <rect x="514" y="228" width="40" height="2" rx="1" fill="#F472B6"/>
  <text x="514" y="256" class="mu" font-size="13">console → new key</text>
  <text x="514" y="278" class="mu" font-size="13">shown only once</text>
  <rect x="721" y="112" width="212" height="208" rx="16" fill="none" stroke="#A78BFA" stroke-opacity="0.14" stroke-width="7"/>
  <rect x="721" y="112" width="212" height="208" rx="16" fill="#0F172A" fill-opacity="0.92" stroke="#A78BFA" stroke-opacity="0.65" stroke-width="1.5"/>
  <circle cx="765" cy="150" r="30" fill="#A78BFA" fill-opacity="0.14"/>
  <circle cx="765" cy="150" r="22" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/>
  <text x="765" y="157" text-anchor="middle" class="mono" font-weight="800" font-size="18" fill="#A78BFA">4</text>
  <text x="741" y="216" class="h2" font-size="19">GitHub repo</text>
  <rect x="741" y="228" width="40" height="2" rx="1" fill="#A78BFA"/>
  <text x="741" y="256" class="mu" font-size="13">push the files</text>
  <text x="741" y="278" class="mu" font-size="13">private is advised</text>
  <rect x="948" y="112" width="212" height="208" rx="16" fill="none" stroke="#34D399" stroke-opacity="0.14" stroke-width="7"/>
  <rect x="948" y="112" width="212" height="208" rx="16" fill="#0F172A" fill-opacity="0.92" stroke="#34D399" stroke-opacity="0.65" stroke-width="1.5"/>
  <circle cx="992" cy="150" r="30" fill="#34D399" fill-opacity="0.14"/>
  <circle cx="992" cy="150" r="22" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
  <text x="992" y="157" text-anchor="middle" class="mono" font-weight="800" font-size="18" fill="#34D399">5</text>
  <text x="968" y="216" class="h2" font-size="19">Railway</text>
  <rect x="968" y="228" width="40" height="2" rx="1" fill="#34D399"/>
  <text x="968" y="256" class="mu" font-size="13">deploy from repo</text>
  <text x="968" y="278" class="mu" font-size="13">volume /opt/data</text>
  <rect x="40" y="342" width="1120" height="42" rx="21" fill="#FBBF24" fill-opacity="0.1" stroke="#FBBF24" stroke-opacity="0.6"/>
  <circle cx="68" cy="363" r="11" fill="#FBBF24"/>
  <text x="68" y="368" text-anchor="middle" class="sans" font-weight="800" font-size="15" fill="#0F172A">!</text>
  <text x="92" y="368" class="mono" font-weight="700" font-size="14" fill="#FDE68A">Keep the Custom Start Command EMPTY. The Dockerfile handles startup.</text>

</svg>
